name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Check CI scripts and workflows
        run: |
          python -m py_compile scripts/*.py
          python -m pip install pyyaml
          python scripts/check-doc-text.py
          python scripts/check-ci-config.py

      - name: Check release metadata consistency
        run: python scripts/check-release-consistency.py

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Sign debug APK (V1+V2+V3)
        run: |
          curl -sL -o /tmp/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          java -jar /tmp/uber-apk-signer.jar \
            --apks app/build/outputs/apk/debug/app-debug.apk \
            --ks ~/.android/debug.keystore \
            --ksAlias androiddebugkey \
            --ksPass android \
            --ksKeyPass android \
            --allowResign \
            --overwrite \
            --skipZipAlign

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
